<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-wrapper">

    <!-- 앱 헤더 -->
    <header class="app-header">
      <h1 class="app-title">Todo</h1>
      <div class="task-summary">
        <span id="summary-total">전체 <strong>0</strong></span>
        <span class="divider">·</span>
        <span id="summary-done">완료 <strong>0</strong></span>
        <span class="divider">·</span>
        <span id="summary-remaining">남은 것 <strong>0</strong></span>
      </div>
    </header>

    <!-- 주간 뷰 -->
    <section class="week-nav" aria-label="주간 날짜 이동">
      <div class="week-header">
        <button id="prev-week-btn" class="week-arrow-btn" aria-label="이전 주">&#8249;</button>
        <span id="week-range-label" class="week-range-label"></span>
        <button id="next-week-btn" class="week-arrow-btn" aria-label="다음 주">&#8250;</button>
      </div>
      <!-- 요일 셀 7개 — JS에서 동적으로 채워짐 -->
      <ul id="week-days" class="week-days" role="list"></ul>
    </section>

    <!-- 일간 날짜 네비게이터 -->
    <section class="date-nav" aria-label="날짜 이동">
      <button id="prev-date-btn" class="date-nav-btn" aria-label="이전 날짜">&#8249;</button>
      <div class="date-display">
        <span id="date-label" class="date-label"></span>
        <span id="today-badge" class="today-badge">오늘</span>
      </div>
      <button id="next-date-btn" class="date-nav-btn" aria-label="다음 날짜">&#8250;</button>
    </section>

    <!-- Todo 입력 영역 -->
    <section class="input-section">
      <div class="input-row">
        <input
          type="text"
          id="todo-input"
          class="todo-input"
          placeholder="할 일을 입력하세요"
          maxlength="100"
          autocomplete="off"
        />
        <button id="add-btn" class="add-btn" aria-label="추가">+</button>
      </div>
      <p id="error-msg" class="error-msg" aria-live="polite"></p>
    </section>

    <!-- 상태별 필터 탭 -->
    <nav class="filter-tabs" role="tablist" aria-label="할 일 필터">
      <button class="filter-tab is-active" data-filter="all"    role="tab" aria-selected="true">전체</button>
      <button class="filter-tab"           data-filter="active" role="tab" aria-selected="false">진행 중</button>
      <button class="filter-tab"           data-filter="done"   role="tab" aria-selected="false">완료</button>
    </nav>

    <!-- Todo 목록 -->
    <main class="todo-list-section">
      <ul id="todo-list" class="todo-list"></ul>
      <div id="empty-state" class="empty-state">
        <span class="empty-icon">✦</span>
        <p id="empty-msg">할 일을 추가해보세요</p>
      </div>
    </main>

  </div>

  <!-- 삭제 확인 모달 -->
  <div id="delete-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <p id="modal-title" class="modal-title">정말 삭제할까요?</p>
      <p id="modal-preview" class="modal-preview"></p>
      <div class="modal-actions">
        <button id="modal-cancel-btn"  class="btn-modal-cancel">취소</button>
        <button id="modal-confirm-btn" class="btn-modal-confirm">삭제</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
